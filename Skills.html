<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Skills</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #000;
            color: white;
        }

        .skill-btn {
            background: #6b5200;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            border: 1px solid #b8860b;
            box-shadow: 0 0 15px #b8860b;
        }

        .title {
            color: #c99a00;
            font-size: 60px;
            font-weight: bold;
        }

        .skill-card {
            background: #f5f5f5;
            border-radius: 25px;
            padding: 30px;
            height: 100%;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: #eee8dd;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #b8860b;
        }

        .tag {
            background: #eee8dd;
            color: #b8860b;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin: 5px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <section class="container py-5">

        <div class="text-center">
            <button class="skill-btn">Skills & Expertise</button>

            <h1 class="title mt-3">Technical Skills</h1>

            <p class="fs-4">
                Technologies and tools I use to design and develop modern web solutions
            </p>
        </div>

        <div class="row g-4 mt-4">

            <div class="col-md-6">
                <div class="skill-card">
                    <div class="d-flex align-items-center mb-4">
                        <div class="icon-box">🖥️</div>
                        <h2 class="ms-4 text-dark">Frontend</h2>
                    </div>

                    <span class="tag">HTML</span>
                    <span class="tag">CSS</span>
                    <span class="tag">JavaScript</span>
                    <span class="tag">Bootstrap</span>
                </div>
            </div>

            <div class="col-md-6">
                <div class="skill-card">
                    <div class="d-flex align-items-center mb-4">
                        <div class="icon-box">🗄️</div>
                        <h2 class="ms-4 text-dark">Backend / CMS</h2>
                    </div>

                    <span class="tag">PHP</span>
                    <span class="tag">MySQL</span>
                    <span class="tag">WordPress</span>
                </div>
            </div>

            <div class="col-md-6">
                <div class="skill-card">
                    <div class="d-flex align-items-center mb-4">
                        <div class="icon-box">🎨</div>
                        <h2 class="ms-4 text-dark">Design Tools</h2>
                    </div>

                    <span class="tag">Figma</span>
                    <span class="tag">Canva</span>
                    <span class="tag">Photoshop</span>
                </div>
            </div>

            <div class="col-md-6">
                <div class="skill-card">
                    <div class="d-flex align-items-center mb-4">
                        <div class="icon-box">⚙️</div>
                        <h2 class="ms-4 text-dark">Dev Tools</h2>
                    </div>

                    <span class="tag">GitHub</span>
                    <span class="tag">VS Code</span>
                    <span class="tag">XAMPP</span>
                </div>
            </div>

        </div>

    </section>

</body>

</html>
