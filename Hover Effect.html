<!DOCTYPE html>
<html>
<head>
<style>
button {
  padding: 10px 20px;
  background: blue;
  color: white;
  border: none;
  cursor: pointer;
  transition: 0.3s;
}

/* Hover effect */
button:hover {
  background: green;
  transform: scale(1.1);
}
</style>
</head>

<body>

<button>Hover Me</button>

</body>
</html>
