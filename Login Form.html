<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: lightpink;
            padding-top: 100px;
        }

        form {
            background: white;
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
        }

        input {
            display: block;
            margin: 10px;
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <h2>Login Form</h2>

    <form>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button>Login</button>
    </form>

</body>

</html>
