<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Simple Alert Message Program</title>
</head>
<body>

    <div class="container text-center mt-5">
        <h2 class="fw-bold">
            SIMPLE ALERT MESSAGE PROGRAM USING JAVASCRIPT
        </h2>

        <button class="btn btn-primary mt-4" onclick="showAlert()">
            Click Here
        </button>
    </div>

    <script>
        function showAlert() {
            alert("Welcome to JavaScript!");
        }
    </script>

</body>
</html>
