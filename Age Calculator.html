<!DOCTYPE html>
<html>
<head>
    <title>Age Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3 class="text-center mb-3">Age Calculator</h3>

        <div class="mb-3">
            <label class="form-label">Enter Birth Year</label>
            <input type="number" id="year" class="form-control" placeholder="Enter Year">
        </div>

        <button class="btn btn-primary" onclick="calc()">
            Calculate
        </button>

        <h4 class="mt-3" id="result"></h4>
    </div>
</div>

<script>
function calc() {
    let year = document.getElementById("year").value;
    let age = 2026 - year;

    document.getElementById("result").innerHTML =
        "Age: " + age;
}
</script>

</body>
</html>
