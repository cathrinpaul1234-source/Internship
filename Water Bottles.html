<html>

<head>
    <title>Water Bottle Collection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
        }

        .container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background: white;
            width: 300px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 10px;
        }

        .title {
            font-size: 20px;
            margin-top: 15px;
            color: #222;
            font-weight: bold;
        }

        .price {
            color: green;
            font-size: 22px;
            margin-top: 10px;
        }

        .offer {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Stay Hydrated in Style 💧</h1>

    <div class="container">

        <div class="card">
            <img src="bottle1.jpg" alt="Bottle 1">

            <div class="title">
                Smart Motivational Bottle
            </div>

            <div class="price">₹118</div>

            <div class="offer">80% OFF</div>
        </div>


        <div class="card">
            <img src="bottle2.jpg" alt="Bottle 2">

            <div class="title">
                Stainless Steel Bottle
            </div>

            <div class="price">₹178</div>

            <div class="offer">64% OFF</div>
        </div>


        <div class="card">
            <img src="bottle3.jpg" alt="Bottle 3">

            <div class="title">
                Transparent Gym Bottle
            </div>

            <div class="price">₹164</div>

            <div class="offer">87% OFF</div>
        </div>

    </div>

</body>

</html>
