<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Pay Gift Cards</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .gift-card {
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #ddd;
            transition: 0.3s;
        }

        .gift-card:hover {
            transform: translateY(-5px);
        }

        .gift-card img {
            height: 250px;
            object-fit: cover;
        }

        .gift-card h3 {
            padding: 15px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <h1 class="text-center fw-bold mb-5">
            Explore popular Amazon Pay Gift Cards
        </h1>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card gift-card">
                    <img src="C:\Users\acer\Downloads\WhatsApp Image 2026-06-02 at 5.59.23 PM.jpeg" class="card-img-top" alt="Your Photo">
                    <h3>Your Photo</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card gift-card">
                    <img src="C:\Users\acer\Downloads\img6.jpg.jpg" class="card-img-top" alt="Animated">
                    <h3>Animated</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card gift-card">
                    <img src="C:\Users\acer\Downloads\img4.jpg.jpg" class="card-img-top" alt="Physical">
                    <h3>Physical</h3>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
