<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Hero</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #1f2630;
            color: white;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 700;
        }

        .hero p {
            color: #8a9099;
            max-width: 800px;
            margin: 20px auto;
            font-size: 1.4rem;
            line-height: 1.8;
        }

        .btn-custom {
            border: 2px solid #00cfff;
            color: #00cfff;
            padding: 12px 40px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .btn-custom:hover {
            background: #00cfff;
            color: #fff;
        }

        .btn-secondary-outline {
            border: 2px solid #fff;
            color: #fff;
            padding: 12px 40px;
            font-size: 1.5rem;
        }

        .btn-secondary-outline:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="container">
            <h1>Dark mode hero</h1>

            <p>
                Quickly design and customize responsive mobile-first sites with
                Bootstrap, the world's most popular front-end open source toolkit,
                featuring Sass variables and mixins, responsive grid system,
                extensive prebuilt components, and powerful JavaScript plugins.
            </p>

            <div class="mt-4">
                <button class="btn btn-custom me-3">
                    Custom button
                </button>

                <button class="btn btn-secondary-outline">
                    Secondary
                </button>
            </div>
        </div>
    </section>

</body>

</html>
