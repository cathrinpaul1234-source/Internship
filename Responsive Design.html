<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .box {
            background: lightblue;
            padding: 20px;
            margin: 10px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .box {
                background: lightgreen;
            }
        }
    </style>
</head>

<body>

    <h2>Responsive Design</h2>

    <div class="box">Hello World</div>

</body>

</html>
